name: Deploy to Namecheap cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  VITE_FIREBASE_API_KEY: "AIzaSyAD5brfUUCMfxxjqFke4vJtFx8eyhGE9us"
  VITE_FIREBASE_AUTH_DOMAIN: "environmental-shapers-network.firebaseapp.com"
  VITE_FIREBASE_PROJECT_ID: "environmental-shapers-network"
  VITE_FIREBASE_STORAGE_BUCKET: "environmental-shapers-network.firebasestorage.app"
  VITE_FIREBASE_MESSAGING_SENDER_ID: "834783600290"
  VITE_FIREBASE_APP_ID: "1:834783600290:web:6b08ba48f099bd2c0c81fb"
  VITE_FIREBASE_MEASUREMENT_ID: "G-M1DV3S0X1R"

jobs:
  build-and-deploy:
    name: Build & Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build

      - name: Sync Files to Namecheap cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 198.187.29.31
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          protocol: ftps
          dangerous-clean-slate: false
