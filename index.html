
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
      <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
      <link rel="shortcut icon" href="/favicon/favicon.ico" />
      <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
      <link rel="manifest" href="/favicon/site.webmanifest" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Environmental Shapers Network (ESN)</title>
      <meta name="description" content="Connects environmental advocates and organizations globally, offering a premium platform for collaboration, resource sharing, and impactful initiatives." />
      <meta name="robots" content="index, follow" />
      <!-- Open Graph / Social Sharing Meta Tags -->
      <meta property="og:type" content="website" />
      <meta property="og:title" content="Environmental Shapers Network (ESN)" />
      <meta property="og:description" content="Connects environmental advocates and organizations globally, offering a premium platform for collaboration, resource sharing, and impactful initiatives." />
      <meta property="og:image" content="/logo.png" />
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" content="Environmental Shapers Network (ESN)" />
      <meta name="twitter:description" content="Connects environmental advocates and organizations globally, offering a premium platform for collaboration, resource sharing, and impactful initiatives." />
      <meta name="twitter:image" content="/logo.png" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      
    </head>

    <body>
      <div id="root">
        <!-- Instant Growing Plant Preloader: Pure growing plant animation from small to big -->
        <style>
          .esn-plant-preloader {
            position: fixed;
            inset: 0;
            background: #0A1A0E;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999999;
            overflow: hidden;
          }
          .esn-ambient-glow {
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(76, 175, 80, 0.3) 0%, rgba(11, 93, 63, 0.08) 55%, transparent 75%);
            filter: blur(28px);
            animation: esnGlowPulse 3s ease-in-out infinite alternate;
            pointer-events: none;
          }
          .esn-growing-plant {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: esnPlantScaleUp 2.8s cubic-bezier(0.34, 1.3, 0.64, 1) infinite;
            transform-origin: 50% 88%;
          }
          @keyframes esnPlantScaleUp {
            0% {
              transform: scale(0.2);
              opacity: 0.2;
            }
            30% {
              transform: scale(0.65);
              opacity: 0.85;
            }
            60% {
              transform: scale(1.18);
              opacity: 1;
            }
            80% {
              transform: scale(1);
              opacity: 1;
            }
            100% {
              transform: scale(0.2);
              opacity: 0.2;
            }
          }
          @keyframes esnGlowPulse {
            0% { transform: scale(0.85); opacity: 0.35; }
            100% { transform: scale(1.35); opacity: 0.8; }
          }
          .esn-stem {
            stroke-dasharray: 65;
            stroke-dashoffset: 65;
            animation: esnStemGrow 2.8s ease-in-out infinite;
          }
          @keyframes esnStemGrow {
            0% { stroke-dashoffset: 65; opacity: 0.3; }
            40%, 85% { stroke-dashoffset: 0; opacity: 1; }
            100% { stroke-dashoffset: 65; opacity: 0.3; }
          }
          .esn-leaf-left {
            transform-origin: 60px 65px;
            animation: esnLeafLeftGrow 2.8s ease-in-out infinite;
          }
          @keyframes esnLeafLeftGrow {
            0%, 20% { transform: scale(0) rotate(-35deg); opacity: 0; }
            50%, 85% { transform: scale(1) rotate(-10deg); opacity: 1; }
            100% { transform: scale(0) rotate(-35deg); opacity: 0; }
          }
          .esn-leaf-right {
            transform-origin: 60px 48px;
            animation: esnLeafRightGrow 2.8s ease-in-out infinite;
          }
          @keyframes esnLeafRightGrow {
            0%, 35% { transform: scale(0) rotate(35deg); opacity: 0; }
            65%, 85% { transform: scale(1) rotate(12deg); opacity: 1; }
            100% { transform: scale(0) rotate(35deg); opacity: 0; }
          }
          .esn-bud {
            transform-origin: 60px 38px;
            animation: esnBudPulse 2.8s ease-in-out infinite;
          }
          @keyframes esnBudPulse {
            0%, 35% { transform: scale(0); opacity: 0; }
            60%, 85% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
          }
        </style>
        <div class="esn-plant-preloader">
          <div class="esn-ambient-glow"></div>
          <div class="esn-growing-plant">
            <svg viewBox="0 0 120 120" width="130" height="130" fill="none" xmlns="http://www.w3.org/2000/svg">
              <ellipse cx="60" cy="102" rx="32" ry="7" fill="#2D5A27" opacity="0.3"></ellipse>
              <path d="M32 102 C 45 96, 75 96, 88 102 C 75 106, 45 106, 32 102 Z" fill="#1B4332"></path>
              <circle cx="52" cy="101" r="1.5" fill="#40916C" opacity="0.8"></circle>
              <circle cx="68" cy="100" r="1.2" fill="#52B788" opacity="0.9"></circle>
              <circle cx="60" cy="103" r="1.8" fill="#74C69D" opacity="0.8"></circle>

              <!-- Sprouting Main Stem -->
              <path class="esn-stem" d="M60 100 C 60 85, 60 65, 60 40" stroke="url(#esnStemGrad)" stroke-width="4.5" stroke-linecap="round"></path>

              <!-- Left Leaf Unfurling -->
              <g class="esn-leaf-left">
                <path d="M60 65 C 45 60, 32 48, 36 34 C 48 35, 58 48, 60 65 Z" fill="url(#esnLeafLeftGrad)" stroke="#1B4332" stroke-width="1.2" stroke-linejoin="round"></path>
                <path d="M60 65 C 50 54, 42 44, 38 36" stroke="#74C69D" stroke-width="1.2" stroke-linecap="round" opacity="0.85"></path>
              </g>

              <!-- Right Leaf Unfurling -->
              <g class="esn-leaf-right">
                <path d="M60 48 C 76 44, 88 32, 84 18 C 72 20, 62 33, 60 48 Z" fill="url(#esnLeafRightGrad)" stroke="#1B4332" stroke-width="1.2" stroke-linejoin="round"></path>
                <path d="M60 48 C 70 38, 78 28, 82 20" stroke="#95D5B2" stroke-width="1.2" stroke-linecap="round" opacity="0.85"></path>
              </g>

              <!-- Top Tender Sprout Bud -->
              <circle class="esn-bud" cx="60" cy="38" r="3.5" fill="#95D5B2"></circle>

              <defs>
                <linearGradient id="esnStemGrad" x1="60" y1="100" x2="60" y2="40" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#1B4332"></stop>
                  <stop offset="60%" stop-color="#2D6A4F"></stop>
                  <stop offset="100%" stop-color="#52B788"></stop>
                </linearGradient>
                <linearGradient id="esnLeafLeftGrad" x1="36" y1="34" x2="60" y2="65" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#52B788"></stop>
                  <stop offset="50%" stop-color="#2D6A4F"></stop>
                  <stop offset="100%" stop-color="#1B4332"></stop>
                </linearGradient>
                <linearGradient id="esnLeafRightGrad" x1="84" y1="18" x2="60" y2="48" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#74C69D"></stop>
                  <stop offset="60%" stop-color="#40916C"></stop>
                  <stop offset="100%" stop-color="#1B4332"></stop>
                </linearGradient>
              </defs>
            </svg>
          </div>
        </div>
      </div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
